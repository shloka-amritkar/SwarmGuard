<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmGuard hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="__FONTS_URL__">
<style>
/* Colours and tokens are generated from core/palette.py (no hex values here). */
/*SG_VARS*/

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--sg-espresso);
  font-family: var(--sg-font-sans);
  overflow: hidden;
}

.hero { position: relative; height: 100vh; min-height: 600px; overflow: hidden; }

/* Background art: a curved flight path with telemetry flowing along it. */
.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.flight { fill: none; stroke: var(--sg-espresso); stroke-opacity: 0.25; stroke-width: 1; }
.orbit { fill: none; stroke: var(--sg-espresso); stroke-opacity: 0.14; stroke-width: 1; stroke-dasharray: 2 7; }
.telemetry { font-family: var(--sg-font-mono); font-size: 13px; fill: var(--sg-ink-2); fill-opacity: 0.8; letter-spacing: 0.02em; }
.drone-body { fill: var(--sg-card); stroke: var(--sg-espresso); stroke-width: 2; }
.drone-rotor { fill: var(--sg-brass); stroke: var(--sg-espresso); stroke-width: 2; }
.drone-arm { stroke: var(--sg-espresso); stroke-width: 2; }
.gnss { fill: var(--sg-card); stroke: var(--sg-espresso); stroke-width: 1.5; }

/* Copy. */
.content {
  position: relative;
  z-index: 2;
  max-width: 880px;
  margin: 0 auto;
  padding: 64px 24px 0 24px;
  text-align: center;
}

.eyebrow {
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sg-stone-text);
  margin: 0;
}

h1 {
  font-family: var(--sg-font-serif);
  font-weight: 400;
  font-size: 64px;
  line-height: 1.02;
  letter-spacing: -0.01em;
  margin: 18px 0 0 0;
}

h1 em { display: block; font-style: italic; color: var(--sg-olive); }

.sub {
  font-size: 17px;
  line-height: 1.6;
  color: var(--sg-ink-2);
  max-width: 560px;
  margin: 18px auto 0 auto;
}

.cta-row { display: flex; gap: 22px; justify-content: center; align-items: center; margin-top: 30px; }

.cta {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  display: inline-block;
  font-family: var(--sg-font-sans);
  font-weight: 600;
  font-size: 16px;
  color: var(--sg-espresso);
  text-decoration: none;
  background: var(--sg-brass);
  border: var(--sg-outline-button) solid var(--sg-espresso);
  border-radius: var(--sg-radius-button);
  box-shadow: var(--sg-shadow-button) var(--sg-shadow-button) 0 var(--sg-espresso);
  padding: 12px 24px;
  transition: transform var(--sg-dur-hover) var(--sg-ease), box-shadow var(--sg-dur-hover) var(--sg-ease), background var(--sg-dur-hover) var(--sg-ease);
}

.cta:hover { background: var(--sg-brass-2); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--sg-espresso); }
.cta:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--sg-espresso); transition-duration: var(--sg-dur-press); }
.cta:focus-visible { outline: 2px solid var(--sg-olive); outline-offset: 3px; }

.link {
  font-weight: 600;
  color: var(--sg-olive);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.link:hover { color: var(--sg-olive-2); }

/* Waveform pill: bars move like a live NIS signal; one bar spikes red now and then. */
.wave {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 46px;
  margin-top: 30px;
  padding: 0 18px 0 14px;
  background: var(--sg-card);
  border: 2.5px solid var(--sg-espresso);
  border-radius: 999px;
}

.wave__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sg-olive); margin-right: 8px; }
.wave__label { font-family: var(--sg-font-mono); font-size: 12px; color: var(--sg-ink-2); margin-left: 10px; }

.bar {
  width: 4px;
  height: 22px;
  border-radius: 2px;
  background: var(--sg-espresso);
  transform-origin: center;
  animation: wave 1.6s var(--sg-ease) infinite alternate;
  animation-delay: calc(var(--i) * -0.17s);
}

.bar--spike { animation: spike 7s var(--sg-ease) infinite; }

@keyframes wave {
  0%   { transform: scaleY(0.25); }
  50%  { transform: scaleY(0.6); }
  100% { transform: scaleY(0.95); }
}

@keyframes spike {
  0%, 62%, 82%, 100% { transform: scaleY(0.4); background: var(--sg-espresso); }
  68%, 76%           { transform: scaleY(1.9); background: var(--sg-status-alarm); }
}

/* Black ribbon of detection events crossing the bottom at a slight angle. */
.ribbon {
  position: absolute;
  z-index: 1;
  left: -6%;
  width: 112%;
  bottom: 38px;
  transform: rotate(-2.2deg);
  background: var(--sg-espresso);
  color: var(--sg-card);
  padding: 12px 0;
  overflow: hidden;
  white-space: nowrap;
}

.track {
  display: inline-flex;
  gap: 44px;
  padding-left: 44px;
  font-size: 14px;
  animation: ribbon 70s linear infinite;
}

.track b { font-weight: 600; }
.track .sep { color: var(--sg-stone-text); }

@keyframes ribbon { from { transform: translateX(0); } to { transform: translateX(-50%); } }

@media (max-width: 900px) {
  h1 { font-size: 40px; }
  .sub { font-size: 15px; }
  .content { padding-top: 40px; }
  .cta-row { flex-direction: column; gap: 14px; }
  .ribbon { bottom: 22px; }
}

/* Calm by default, still under reduced motion (SVG motion is paused in the script). */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .bar { transform: scaleY(0.5); }
}
</style>
</head>
<body>
<div class="hero">
  <svg class="art" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path id="flight" class="flight" d="M -60 520 C 160 380, 360 640, 600 500 S 1000 330, 1260 450"/>
    <path class="orbit" d="M 760 40 C 900 -10, 1120 40, 1180 140"/>
    <path class="orbit" d="M 20 150 C 80 60, 240 20, 380 40"/>
    <g transform="translate(1012 70)"><rect class="gnss" x="-7" y="-7" width="14" height="14" rx="2"/></g>
    <g transform="translate(140 76)"><circle class="gnss" r="6"/></g>
    <g transform="translate(330 38)"><circle class="gnss" r="4.5"/></g>
    <text class="telemetry">
      <textPath href="#flight" startOffset="100%">__TELEMETRY__
        <animate attributeName="startOffset" from="100%" to="-140%" dur="90s" repeatCount="indefinite"/>
      </textPath>
    </text>
    <g>
      <animateMotion dur="34s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flight"/>
      </animateMotion>
      <g transform="translate(0 -20) scale(0.55)">
        <line class="drone-arm" x1="-16" y1="-16" x2="16" y2="16"/>
        <line class="drone-arm" x1="16" y1="-16" x2="-16" y2="16"/>
        <circle class="drone-rotor" cx="-16" cy="-16" r="9"/>
        <circle class="drone-rotor" cx="16" cy="-16" r="9"/>
        <circle class="drone-rotor" cx="-16" cy="16" r="9"/>
        <circle class="drone-rotor" cx="16" cy="16" r="9"/>
        <rect class="drone-body" x="-8" y="-8" width="16" height="16" rx="4"/>
      </g>
    </g>
  </svg>

  <div class="content">
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__HEADLINE_1__<em>__HEADLINE_2__</em></h1>
    <p class="sub">__SUBTITLE__</p>
    <div class="cta-row">
      <a id="cta" class="cta" href="#sg-quickstart">Run a scenario</a>
      <a id="how" class="link" href="#sg-how">How it works</a>
    </div>
    <div class="wave" aria-hidden="true">
      <span class="wave__dot"></span>
      __BARS__
      <span class="wave__label">NIS</span>
    </div>
  </div>

  <div class="ribbon" aria-hidden="true"><div class="track">__RIBBON__ __RIBBON__</div></div>
</div>
<script>
  // Reduced motion: CSS stops the CSS animations; SVG (SMIL) motion is paused here.
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const art = document.querySelector("svg.art");
  function applyMotion() {
    if (reduce.matches) { art.pauseAnimations(); } else { art.unpauseAnimations(); }
  }
  applyMotion();
  reduce.addEventListener("change", applyMotion);

  // The hero is an iframe, so it cannot call Streamlit. Its links scroll the
  // parent page to the real Streamlit buttons placed under the hero.
  function scrollParentTo(id) {
    try {
      const target = window.parent.document.getElementById(id);
      if (target) { target.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" }); }
    } catch (err) { /* parent not reachable: the buttons are right below anyway */ }
  }
  document.getElementById("cta").addEventListener("click", (e) => { e.preventDefault(); scrollParentTo("sg-quickstart"); });
  document.getElementById("how").addEventListener("click", (e) => { e.preventDefault(); scrollParentTo("sg-how"); });
</script>
</body>
</html>
