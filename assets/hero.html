<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmGuard hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="__FONTS_URL__">
<!--
  SwarmGuard Home hero ("Ground Truth", docs/phases/phase-7.md B8).
  ui/hero.py fills the placeholders and inserts the palette as CSS
  variables, so this file contains no colour values of its own.

  Left column: eyebrow, Fraunces headline, subtitle.
  Right column: an amber radar scope in a charcoal instrument panel with
  crosshair corners. A sweep turns once every 8 s and the ten drone blips
  brighten as it passes. Every 10 s one blip splits into its TRUE position
  (filled dot) and its SPOOFED GPS position (hollow dot) joined by a growing
  dashed line; an "ALARM · motion check" label appears, holds and fades, the
  NIS readout jumps from 2.1 to 48.6, and the blip rejoins.
  Motion: CSS for the sweep and blips, SVG SMIL for the spoof event (so its
  parts stay in step). Under prefers-reduced-motion everything is paused.
-->
<style>
/*SG_VARS*/
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: transparent;
  color: var(--sg-espresso);
  font-family: var(--sg-font-sans);
  -webkit-font-smoothing: antialiased;
}

/* M3 coordinate rulers along the top and left edges. */
.frame {
  position: relative;
  padding: 30px 8px 8px 74px;
  height: 100vh;
  min-height: 520px;
}
.ruler { position: absolute; font-family: var(--sg-font-mono); font-size: 10px; color: var(--sg-stone-text); }
.ruler--top { left: 74px; right: 8px; top: 0; height: 24px; border-bottom: 1px solid var(--sg-espresso); }
.ruler--left { top: 30px; bottom: 8px; left: 0; width: 66px; border-right: 1px solid var(--sg-espresso); }
.tick { position: absolute; background: var(--sg-espresso); }
.ruler--top .tick { bottom: 0; width: 1px; height: 5px; }
.ruler--top .tick.major { height: 10px; }
.ruler--left .tick { right: 0; height: 1px; width: 5px; }
.ruler--left .tick.major { width: 10px; }
.label { position: absolute; white-space: nowrap; letter-spacing: 0.02em; }
.ruler--top .label { top: 2px; transform: translateX(-50%); }
.ruler--left .label { right: 13px; transform: translateY(-50%); }
.ruler--top .label.first { transform: none; }
.ruler--top .label.last { transform: translateX(-100%); }
.ruler--left .label.first { transform: translateY(-100%); }
.ruler--left .label.last { transform: none; }

/* Two columns inside the rulers. */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 40px;
  align-items: center;
  height: 100%;
  padding: 18px 8px 8px 28px;
}
.eyebrow {
  font-family: var(--sg-font-mono);
  font-weight: 500;
  font-size: var(--sg-size-eyebrow);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--sg-stone-text);
  margin: 0 0 18px 0;
}
h1 {
  font-family: var(--sg-font-serif);
  font-optical-sizing: auto;
  font-weight: 500;
  font-size: var(--sg-size-hero);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: 0;
}
h1 em { display: block; font-style: italic; color: var(--sg-olive); }
.subtitle { font-size: 17px; line-height: 1.6; color: var(--sg-ink-2); max-width: 470px; margin: 22px 0 0 0; }
.coords {
  font-family: var(--sg-font-mono);
  font-size: 12px;
  color: var(--sg-stone-text);
  margin: 26px 0 0 0;
  display: flex;
  gap: 10px;
  align-items: center;
}
.coords::before { content: ""; width: 28px; height: 1px; background: var(--sg-espresso); }

/* The instrument panel with M2 crosshair corners. */
.panel {
  position: relative;
  background: var(--sg-charcoal);
  border: 1px solid var(--sg-char-line);
  border-radius: var(--sg-radius-card);
  padding: 14px;
  aspect-ratio: 1 / 1;
  max-height: calc(100vh - 70px);
  justify-self: center;
  width: 100%;
  max-width: 480px;
}
.panel::before {
  content: "";
  position: absolute;
  inset: -7px;
  background: var(--sg-corners-ink);
  pointer-events: none;
}
.panel__head {
  position: absolute;
  top: 12px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  font-family: var(--sg-font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sg-char-mute);
}
.panel__head b { color: var(--sg-amber); font-weight: 500; }
svg.scope { width: 100%; height: 100%; display: block; overflow: visible; }

.ring { fill: none; stroke: var(--sg-char-line); stroke-width: 1; }
.axis { stroke: var(--sg-char-line); stroke-width: 1; stroke-dasharray: 2 4; }
.bearing { stroke: var(--sg-char-mute); stroke-width: 1; }
.bearing-label { fill: var(--sg-char-mute); font-family: var(--sg-font-mono); font-size: 9px; text-anchor: middle; }

/* The sweep: three flat wedges of falling opacity (no gradient) and a
   bright leading line, turning once every 8 s. */
.sweep { animation: sweep 8s linear infinite; transform-origin: 0 0; }
.wedge { fill: var(--sg-amber); }
.lead { stroke: var(--sg-amber); stroke-width: 1.5; }
@keyframes sweep { to { transform: rotate(360deg); } }

/* Blips brighten as the sweep passes (delay set per blip from its bearing). */
.blip {
  fill: var(--sg-amber);
  transform-box: fill-box;
  transform-origin: center;
  animation: blip 8s linear infinite;
}
@keyframes blip {
  0%   { opacity: 1; transform: scale(1.45); }
  12%  { opacity: 0.75; transform: scale(1); }
  100% { opacity: 0.32; transform: scale(1); }
}

.true-dot { fill: var(--sg-amber); }
.spoof-dot { fill: none; stroke: var(--sg-char-text); stroke-width: 1.5; }
.spoof-line { stroke: var(--sg-char-text); stroke-width: 1; stroke-dasharray: 3 3; }
.alarm-pill { fill: var(--sg-status-alarm); }
.alarm-text { fill: var(--sg-sand); font-family: var(--sg-font-mono); font-size: 10px; letter-spacing: 0.04em; }
.readout { fill: var(--sg-char-mute); font-family: var(--sg-font-mono); font-size: 10px; }
.readout b, .readout .hot { fill: var(--sg-amber); }
.centre-label { fill: var(--sg-char-mute); font-family: var(--sg-font-mono); font-size: 9px; }

@media (max-width: 760px) {
  .frame { padding: 26px 4px 4px 4px; }
  .ruler--left { display: none; }
  .ruler--top { left: 4px; right: 4px; }
  .hero { grid-template-columns: 1fr; gap: 18px; padding: 14px 6px 6px 6px; align-content: start; }
  h1 { font-size: var(--sg-size-hero-small); }
  .subtitle { font-size: 15px; margin-top: 14px; }
  .coords { display: none; }
  .panel { max-width: 300px; max-height: none; }
}

@media (prefers-reduced-motion: reduce) {
  .sweep, .blip { animation: none; }
  .blip { opacity: 0.8; }
}
</style>
</head>
<body>
<div class="frame">
  <div class="ruler ruler--top" aria-hidden="true">__RULER_TOP__</div>
  <div class="ruler ruler--left" aria-hidden="true">__RULER_LEFT__</div>
  <div class="hero">
    <div>
      <p class="eyebrow">__EYEBROW__</p>
      <h1>__HEADLINE_1__ <em>__HEADLINE_2__</em></h1>
      <p class="subtitle">__SUBTITLE__</p>
      <p class="coords">ORIGIN 18.5204°N 73.8567°E · PUNE · LOCAL EAST-NORTH FRAME (m)</p>
    </div>
    <div class="panel" role="img" aria-label="Animated radar scope: a drone's reported GPS position separates from its true position and a motion-check alarm appears.">
      <div class="panel__head"><span>Scope · 10 drones</span><b>simulation</b></div>
      <svg class="scope" viewBox="-200 -200 400 400" aria-hidden="true">
        <circle class="ring" r="60"/><circle class="ring" r="120"/><circle class="ring" r="180"/>
        <line class="axis" x1="-180" y1="0" x2="180" y2="0"/>
        <line class="axis" x1="0" y1="-180" x2="0" y2="180"/>
        __BEARINGS__
        <g class="sweep">
          <path class="wedge" opacity="0.05" d="__WEDGE_3__"/>
          <path class="wedge" opacity="0.09" d="__WEDGE_2__"/>
          <path class="wedge" opacity="0.15" d="__WEDGE_1__"/>
          <line class="lead" x1="0" y1="0" x2="0" y2="-180"/>
        </g>
        __BLIPS__
        __EVENT__
        <text class="centre-label" x="6" y="-4">0 m</text>
        <text class="centre-label" x="6" y="134">20 m</text>
        <text class="readout" x="-186" y="190">NIS <tspan class="hot">2.1</tspan><tspan>__NIS_HOT__</tspan></text>
      </svg>
    </div>
  </div>
</div>
<script>
  // Pause every animation (CSS and SVG SMIL) for people who prefer less motion.
  (function () {
    var query = window.matchMedia("(prefers-reduced-motion: reduce)");
    function apply() {
      var svg = document.querySelector("svg.scope");
      if (!svg || !svg.pauseAnimations) { return; }
      if (query.matches) { svg.pauseAnimations(); svg.setCurrentTime(0); } else { svg.unpauseAnimations(); }
    }
    apply();
    if (query.addEventListener) { query.addEventListener("change", apply); }
  })();
</script>
</body>
</html>
