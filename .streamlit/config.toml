# SwarmGuard Streamlit configuration ("Ground Truth", docs/phases/phase-7.md B1).
# TOML cannot import Python, so the few colours below are copies of
# core/palette.py values. tests/test_phase5.py checks they still match.

[theme]
base = "light"
backgroundColor = "#F3EEE3"          # sand
secondaryBackgroundColor = "#FBF8F2" # card
textColor = "#1E1A16"                # espresso
primaryColor = "#3F4F24"             # olive
linkColor = "#3F4F24"                # olive
borderColor = "#1E1A16"              # espresso outlines on widgets
showWidgetBorder = true
redColor = "#B3261E"                 # brick: alarms only
font = "sans serif"
baseRadius = "8px"
buttonRadius = "8px"
dataframeBorderColor = "#DDD5C4"     # rule
dataframeHeaderBackgroundColor = "#ECE5D6"  # vellum

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
runOnSave = false
